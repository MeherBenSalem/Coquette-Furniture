plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    accessWidenerPath.set(file("src/main/resources/${mod_id}.accesswidener"))
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            // ./gradlew :fabric:runClient -Pshowcase builds a showcase world, screenshots it and quits
            if (project.hasProperty('showcase')) vmArg('-Dcoquettefurniture.showcase=true')
            if (project.hasProperty('clientArgs')) programArgs(project.property('clientArgs').toString().split(' '))
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}

jar {
    // the showcase harness is a development tool only
    exclude 'com/sugarplumstudios/coquette/dev/**'
}
