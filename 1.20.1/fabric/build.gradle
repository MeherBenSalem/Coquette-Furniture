plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation project(":common")
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            // ./gradlew :fabric:runClient -Pshowcase builds a showcase world, screenshots it and quits
            if (project.hasProperty('showcase')) vmArg('-Dcoquettefurniture.showcase=true')
            if (project.hasProperty('clientArgs')) programArgs(project.property('clientArgs').toString().split(' '))
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

jar {
    // the showcase harness is a development tool only
    exclude 'com/sugarplumstudios/coquette/dev/**'
}
